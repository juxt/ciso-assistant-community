model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      # Sonnet 4.6 also rejects an explicit temperature value. CISO Assistant's
      # chat code sends it unconditionally, so strip before forwarding.
      drop_params: true
      additional_drop_params:
        - temperature
      # Anthropic returns overloaded_error in waves. Retry before surfacing
      # failure to the chat. Note: mid-stream overload failures cannot be
      # retried at the LiteLLM layer — these retries cover pre-stream errors.
      num_retries: 5
      timeout: 120
      # Extended thinking: give the model budget to verify its own work
      # before emitting tokens. Critical for spec-name fidelity — without
      # it the model paraphrases identifiers; with it the model has a
      # chance to check spec names against the retrieved chunks before
      # committing to a response.
      thinking:
        type: "enabled"
        budget_tokens: 4000

litellm_settings:
  drop_params: true
  request_timeout: 120
  num_retries: 5
